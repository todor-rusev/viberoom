<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6af7"/>
      <stop offset="1" stop-color="#4f4fe0"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1c1b33" flood-opacity="0.10"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f8fb0"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5bf0"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="24" fill="#f6f6fb"/>
  <text x="32" y="44" font-size="13" font-weight="800" fill="#8f8fb0" letter-spacing="2">ONE TASK, FOUR HANDS</text>
  <g transform="translate(32,96)" filter="url(#s)">
    <rect width="150" height="112" rx="18" fill="url(#g)"/>
    <text x="20" y="46" font-size="30">🦊</text>
    <text x="64" y="40" font-size="16" font-weight="800" fill="#fff">You</text>
    <text x="64" y="60" font-size="12" font-weight="700" fill="#e4e6fb">the human</text>
    <text x="20" y="92" font-size="12" font-weight="700" fill="#fff">"Tidy the contacts"</text>
  </g>
  <g transform="translate(250,96)" filter="url(#s)">
    <rect width="170" height="112" rx="18" fill="#fff"/>
    <text x="18" y="46" font-size="30">🐸</text>
    <text x="62" y="40" font-size="16" font-weight="800" fill="#6a5bd6">Pip</text>
    <text x="62" y="60" font-size="12" font-weight="700" fill="#8f8fb0">product voice</text>
    <rect x="18" y="74" width="134" height="24" rx="12" fill="#eef0fb"/>
    <text x="85" y="90" font-size="12" font-weight="800" fill="#5b5bf0" text-anchor="middle">writes the criteria</text>
  </g>
  <g transform="translate(488,96)" filter="url(#s)">
    <rect width="170" height="112" rx="18" fill="#fff"/>
    <text x="18" y="46" font-size="30">🦉</text>
    <text x="62" y="40" font-size="16" font-weight="800" fill="#2e9d5b">Nova</text>
    <text x="62" y="60" font-size="12" font-weight="700" fill="#8f8fb0">builds it</text>
    <rect x="18" y="74" width="134" height="24" rx="12" fill="#d9f7e8"/>
    <text x="85" y="90" font-size="12" font-weight="800" fill="#1d8f6a" text-anchor="middle">changes the files</text>
  </g>
  <g transform="translate(726,96)" filter="url(#s)">
    <rect width="170" height="112" rx="18" fill="#fff"/>
    <text x="18" y="46" font-size="30">🤠</text>
    <text x="62" y="40" font-size="16" font-weight="800" fill="#d9781f">Rex</text>
    <text x="62" y="60" font-size="12" font-weight="700" fill="#8f8fb0">red pen</text>
    <rect x="12" y="74" width="146" height="24" rx="12" fill="#fff3cc"/>
    <text x="85" y="90" font-size="11.5" font-weight="800" fill="#b3660a" text-anchor="middle">3 findings, or "Ship it"</text>
  </g>
  <g stroke="#8f8fb0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M184,150 L248,150"/>
    <path d="M422,150 L486,150"/>
    <path d="M660,150 L724,150"/>
  </g>
  <g font-size="11" font-weight="800" fill="#8f8fb0" text-anchor="middle">
    <text x="216" y="140">@Pip</text>
    <text x="454" y="140">@Nova</text>
    <text x="692" y="140">@Rex</text>
  </g>
  <path d="M700,208 C700,250 520,250 520,208" stroke="#5b5bf0" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <rect x="560" y="226" width="146" height="22" rx="11" fill="#fff" stroke="#e4e6fb"/>
  <text x="633" y="241" font-size="11" font-weight="800" fill="#5b5bf0" text-anchor="middle">fix → review, twice at most</text>
  <path d="M810,208 C810,282 120,282 108,208" stroke="#5b5bf0" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <rect x="330" y="262" width="250" height="22" rx="11" fill="#fff" stroke="#e4e6fb"/>
  <text x="455" y="277" font-size="11" font-weight="800" fill="#5b5bf0" text-anchor="middle">Pip checks every criterion: pass or fail, to you</text>
</svg>
