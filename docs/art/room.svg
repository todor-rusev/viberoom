<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Nunito, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6af7"/>
      <stop offset="1" stop-color="#4f4fe0"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1c1b33" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="320" rx="24" fill="#f6f6fb"/>
  <text x="32" y="44" font-size="13" font-weight="800" fill="#8f8fb0" letter-spacing="2">WHAT A ROOM IS</text>
  <g transform="translate(32,64)" filter="url(#s)">
    <rect width="600" height="224" rx="20" fill="#fff"/>
    <text x="24" y="40" font-size="22">🧹</text>
    <text x="58" y="40" font-size="19" font-weight="800" fill="#1c1b33">Contact cleanup</text>
    <rect x="228" y="22" width="150" height="26" rx="13" fill="#eef0fb"/>
    <text x="303" y="40" font-size="12" font-weight="800" fill="#5b5bf0" text-anchor="middle">📁 ~/work/contacts</text>
    <g transform="translate(24,66)">
      <rect width="168" height="46" rx="14" fill="#f6f6fb"/>
      <text x="12" y="31" font-size="22">🐸</text>
      <text x="46" y="22" font-size="13" font-weight="800" fill="#6a5bd6">Pip</text>
      <text x="46" y="37" font-size="10.5" font-weight="700" fill="#8f8fb0">product voice</text>
    </g>
    <g transform="translate(206,66)">
      <rect width="168" height="46" rx="14" fill="#f6f6fb"/>
      <text x="12" y="31" font-size="22">🦉</text>
      <text x="46" y="22" font-size="13" font-weight="800" fill="#2e9d5b">Nova</text>
      <text x="46" y="37" font-size="10.5" font-weight="700" fill="#8f8fb0">builds it, tests it</text>
    </g>
    <g transform="translate(388,66)">
      <rect width="188" height="46" rx="14" fill="#f6f6fb"/>
      <text x="12" y="31" font-size="22">🤠</text>
      <text x="46" y="22" font-size="13" font-weight="800" fill="#d9781f">Rex</text>
      <text x="46" y="37" font-size="10.5" font-weight="700" fill="#8f8fb0">reviewer with a red pen</text>
    </g>
    <g transform="translate(24,128)">
      <rect width="352" height="72" rx="14" fill="#eef0fb"/>
      <text x="14" y="20" font-size="10.5" font-weight="800" fill="#8f8fb0" letter-spacing="1.5">ROOM RULES</text>
      <text x="14" y="40" font-size="11.5" font-weight="700" fill="#2c2b4a">Keep replies under 6 sentences.</text>
      <text x="14" y="58" font-size="11.5" font-weight="700" fill="#2c2b4a">Only <tspan fill="#6a5bd6" font-weight="800">@Pip</tspan> talks to the human. <tspan fill="#d9781f" font-weight="800">@Rex</tspan> never adds features.</text>
    </g>
    <g transform="translate(388,128)">
      <rect width="188" height="72" rx="14" fill="#fff3cc"/>
      <text x="14" y="20" font-size="10.5" font-weight="800" fill="#b3660a" letter-spacing="1.5">SKILLS</text>
      <rect x="14" y="30" width="118" height="24" rx="12" fill="#fff"/>
      <text x="73" y="46" font-size="11.5" font-weight="800" fill="#5b5bf0" text-anchor="middle">/contact-dedupe</text>
      <rect x="138" y="30" width="36" height="24" rx="12" fill="#fff"/>
      <text x="156" y="46" font-size="11.5" font-weight="800" fill="#5b5bf0" text-anchor="middle">+1</text>
    </g>
  </g>
  <g font-size="13" font-weight="700" fill="#2c2b4a">
    <g transform="translate(672,84)">
      <circle cx="10" cy="8" r="10" fill="url(#g)"/><text x="10" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text>
      <text x="30" y="12" font-weight="800">A folder and a topic.</text>
      <text x="30" y="30" fill="#8f8fb0">Everyone works in that folder.</text>
      <text x="30" y="46" fill="#8f8fb0">The history stays with the room.</text>
    </g>
    <g transform="translate(672,146)">
      <circle cx="10" cy="8" r="10" fill="url(#g)"/><text x="10" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text>
      <text x="30" y="12" font-weight="800">Vibemates with a character.</text>
      <text x="30" y="30" fill="#8f8fb0">Any agent you have, a name,</text>
      <text x="30" y="46" fill="#8f8fb0">a face, a private brief.</text>
    </g>
    <g transform="translate(672,208)">
      <circle cx="10" cy="8" r="10" fill="url(#g)"/><text x="10" y="12" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text>
      <text x="30" y="12" font-weight="800">Rules and skills.</text>
      <text x="30" y="30" fill="#8f8fb0">Who speaks to whom, how long,</text>
      <text x="30" y="46" fill="#8f8fb0">and reusable know-how on tap.</text>
    </g>
  </g>
</svg>
